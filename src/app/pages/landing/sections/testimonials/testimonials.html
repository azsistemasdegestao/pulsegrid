<section class="border-t border-border">
  <div class="mx-auto max-w-6xl px-4 py-20 sm:px-6 sm:py-28 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-3xl font-bold tracking-tight sm:text-4xl">Loved by data-driven teams</h2>
      <p class="mt-4 text-muted">Here's what early users say about working with Pulsegrid.</p>
    </div>

    <div class="mt-16 grid gap-6 sm:grid-cols-3">
      @for (testimonial of testimonials; track testimonial.author) {
        <figure class="flex flex-col rounded-2xl border border-border bg-surface p-6">
          <blockquote class="flex-1 text-sm text-foreground">
            <p>&ldquo;{{ testimonial.quote }}&rdquo;</p>
          </blockquote>
          <figcaption class="mt-6 flex items-center gap-3">
            <span
              class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-accent to-accent-secondary text-sm font-semibold text-white"
            >
              {{ testimonial.initials }}
            </span>
            <div>
              <p class="text-sm font-semibold">{{ testimonial.author }}</p>
              <p class="text-xs text-muted">{{ testimonial.role }}</p>
            </div>
          </figcaption>
        </figure>
      }
    </div>
  </div>
</section>
