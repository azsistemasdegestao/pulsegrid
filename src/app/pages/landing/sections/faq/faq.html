<section id="faq" class="border-t border-border bg-surface/30">
  <div class="mx-auto max-w-3xl px-4 py-20 sm:px-6 sm:py-28 lg:px-8">
    <div class="text-center">
      <h2 class="text-3xl font-bold tracking-tight sm:text-4xl">Frequently asked questions</h2>
      <p class="mt-4 text-muted">
        Can't find the answer you're looking for? Reach out using the form below.
      </p>
    </div>

    <div class="mt-12 divide-y divide-border rounded-2xl border border-border bg-background">
      @for (item of items; track item.question; let i = $index) {
        <div>
          <button
            type="button"
            class="flex w-full items-center justify-between gap-4 px-6 py-5 text-left"
            [attr.aria-expanded]="openIndex() === i"
            (click)="toggle(i)"
          >
            <span class="text-sm font-semibold sm:text-base">{{ item.question }}</span>
            <span
              class="inline-flex shrink-0 text-muted transition-transform"
              [class.rotate-180]="openIndex() === i"
            >
              <app-icon name="chevron-down" iconClass="h-5 w-5" />
            </span>
          </button>
          @if (openIndex() === i) {
            <div class="px-6 pb-5 text-sm text-muted">{{ item.answer }}</div>
          }
        </div>
      }
    </div>
  </div>
</section>
