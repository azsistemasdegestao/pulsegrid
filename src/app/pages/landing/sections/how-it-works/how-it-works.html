<section id="how-it-works" class="border-t border-border bg-surface/30">
  <div class="mx-auto max-w-6xl px-4 py-20 sm:px-6 sm:py-28 lg:px-8">
    <div class="mx-auto max-w-2xl text-center">
      <h2 class="text-3xl font-bold tracking-tight sm:text-4xl">
        Up and running in
        <span class="bg-gradient-to-r from-accent to-accent-secondary bg-clip-text text-transparent"
          >three steps</span
        >
      </h2>
      <p class="mt-4 text-muted">No lengthy onboarding, no dedicated data team required.</p>
    </div>

    <div class="mt-16 grid gap-6 sm:grid-cols-3">
      @for (step of steps; track step.title; let i = $index) {
        <div class="rounded-2xl border border-border bg-background p-6">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-accent to-accent-secondary text-sm font-bold text-white"
          >
            {{ i + 1 }}
          </div>
          <h3 class="mt-4 text-lg font-semibold">{{ step.title }}</h3>
          <p class="mt-2 text-sm text-muted">{{ step.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
