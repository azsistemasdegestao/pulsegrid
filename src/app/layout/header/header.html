<header class="sticky top-0 z-50 border-b border-border bg-background/80 backdrop-blur-md">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      class="flex items-center gap-2 text-lg font-bold tracking-tight text-foreground"
    >
      <span
        class="flex h-8 w-8 items-center justify-center rounded-lg bg-gradient-to-br from-accent to-accent-secondary text-white"
      >
        <app-icon name="activity" iconClass="h-5 w-5" />
      </span>
      Pulsegrid
    </a>

    <nav class="hidden items-center gap-8 text-sm font-medium text-muted md:flex">
      <a routerLink="/" fragment="features" class="transition-colors hover:text-foreground"
        >Features</a
      >
      <a routerLink="/" fragment="how-it-works" class="transition-colors hover:text-foreground"
        >How it works</a
      >
      <a routerLink="/" fragment="faq" class="transition-colors hover:text-foreground">FAQ</a>
    </nav>

    <div class="flex items-center gap-2">
      <a
        routerLink="/"
        fragment="demo"
        class="hidden rounded-lg bg-gradient-to-r from-accent to-accent-secondary px-4 py-2 text-sm font-semibold text-white transition hover:opacity-90 sm:inline-flex"
      >
        Request a Demo
      </a>

      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg border border-border p-2 text-foreground md:hidden"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
        (click)="toggleMenu()"
      >
        <app-icon [name]="isMenuOpen() ? 'close' : 'menu'" iconClass="h-5 w-5" />
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <nav class="border-t border-border px-4 pb-4 md:hidden">
      <a
        routerLink="/"
        fragment="features"
        (click)="closeMenu()"
        class="block py-2 text-sm text-muted hover:text-foreground"
        >Features</a
      >
      <a
        routerLink="/"
        fragment="how-it-works"
        (click)="closeMenu()"
        class="block py-2 text-sm text-muted hover:text-foreground"
        >How it works</a
      >
      <a
        routerLink="/"
        fragment="faq"
        (click)="closeMenu()"
        class="block py-2 text-sm text-muted hover:text-foreground"
        >FAQ</a
      >
      <a
        routerLink="/"
        fragment="demo"
        (click)="closeMenu()"
        class="mt-2 block rounded-lg bg-gradient-to-r from-accent to-accent-secondary px-4 py-2 text-center text-sm font-semibold text-white"
      >
        Request a Demo
      </a>
    </nav>
  }
</header>
